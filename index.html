     <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoveCare - تمارينك اليومية</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f8;
      color: #222;
    }

    header {
      background: #1677ff;
      color: white;
      text-align: center;
      padding: 35px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .start {
      text-align: center;
      margin-bottom: 25px;
    }

    .start button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    h2 {
      text-align: center;
      margin-top: 25px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .category {
      background: white;
      padding: 25px 15px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .category:hover {
      transform: translateY(-3px);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .category h3 {
      margin: 5px 0;
    }

    .category p {
      color: #666;
      margin: 5px 0;
    }

    #exercises {
      display: none;
      margin-top: 30px;
    }

    .exercise {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .exercise h3 {
      margin-top: 0;
      color: #1677ff;
    }

    .exercise button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>MoveCare</h1>
  <p>تحرك أكثر، عِش أفضل 💪</p>
</header>

<div class="container">

  <div class="start">
    <h2>ابدأ الآن</h2>
    <p>اختر المنطقة التي تريد تمرينها</p>
  </div>

  <div class="categories">

    <div class="category" onclick="showExercises('legs')">
      <div class="icon">🦵</div>
      <h3>الرجل</h3>
      <p>تمارين للساقين</p>
    </div>

    <div class="category" onclick="showExercises('back')">
      <div class="icon">🏃</div>
      <h3>الظهر</h3>
      <p>تمارين للظهر</p>
    </div>

    <div class="category" onclick="showExercises('chest')">
      <div class="icon">💪</div>
      <h3>الصدر</h3>
      <p>تمارين للصدر</p>
    </div>

    <div class="category" onclick="showExercises('arms')">
      <div class="icon">💪</div>
      <h3>الذراعان</h3>
      <p>تمارين للذراعين</p>
    </div>

    <div class="category" onclick="showExercises('abs')">
      <div class="icon">🔥</div>
      <h3>البطن</h3>
      <p>تمارين للبطن</p>
    </div>

    <div class="category" onclick="showExercises('full')">
      <div class="icon">🏋️</div>
      <h3>الجسم كامل</h3>
      <p>تمارين متنوعة</p>
    </div>

  </div>

  <div id="exercises">
    <h2 id="exerciseTitle"></h2>
    <div id="exerciseList"></div>
  </div>

</div>

<footer>
  © 2026 MoveCare
</footer>

<script>

const data = {

  legs: {
    title: "تمارين الرجل 🦵",
    exercises: [
      ["القرفصاء", "قف بشكل مستقيم ثم انزل بجسمك ببطء واصعد مجددًا."],
      ["الاندفاع", "خذ خطوة إلى الأمام ثم انزل بجسمك وارجع إلى وضع البداية."],
      ["رفع الساق", "ارفع ساقك بشكل مستقيم ثم أعدها ببطء."]
    ]
  },

  back: {
    title: "تمارين الظهر 🏃",
    exercises: [
      ["تمدد الظهر", "اجلس أو استلقِ بشكل مريح ومدد ظهرك بلطف."],
      ["وضعية الطفل", "اجلس على ركبتيك ومد ذراعيك إلى الأمام بلطف."],
      ["تمدد جانبي", "مد جسمك إلى أحد الجانبين ثم بدّل الجهة."]
    ]
  },

  chest: {
    title: "تمارين الصدر 💪",
    exercises: [
      ["تمرين الضغط", "ضع يديك على الأرض وادفع جسمك للأعلى ثم انزل ببطء."],
      ["ضغط على الحائط", "ضع يديك على الحائط وادفع جسمك نحوه ثم ابتعد."],
      ["ضغط الركبتين", "نفذ تمرين الضغط مع إبقاء الركبتين على الأرض."]
    ]
  },

  arms: {
    title: "تمارين الذراعين 💪",
    exercises: [
      ["دوائر الذراعين", "مد ذراعيك وقم بحركات دائرية صغيرة."],
      ["تمدد الذراع", "مد ذراعك أمامك واسحبه بلطف باليد الأخرى."],
      ["رفع الذراعين", "ارفع ذراعيك إلى الأعلى ثم أعدهما ببطء."]
    ]
  },

  abs: {
    title: "تمارين البطن 🔥",
    exercises: [
      ["بلانك", "ثبت جسمك في وضع مستقيم مع الاعتماد على الساعدين والقدمين."],
      ["رفع الركبتين", "ارفع ركبتيك باتجاه جسمك بشكل متحكم."],
      ["تمرين الدراجة", "حرّك ساقيك بالتناوب بحركة تشبه ركوب الدراجة."]
    ]
  },

  full: {
    title: "تمارين الجسم كامل 🏋️",
    exercises: [
      ["القرفصاء", "انزل بجسمك ببطء ثم عد إلى وضع الوقوف."],
      ["الضغط", "نفذ تمرين الضغط بطريقة مريحة وآمنة."],
      ["المشي في المكان", "امشِ في مكانك وارفع ركبتيك بشكل معتدل."],
      ["تمدد الجسم", "مد ذراعيك وساقيك بلطف لتحريك الجسم."]
    ]
  }

};

function showExercises(type) {

  const section = document.getElementById("exercises");
  const title = document.getElementById("exerciseTitle");
  const list = document.getElementById("exerciseList");

  title.textContent = data[type].title;
  list.innerHTML = "";

  data[type].exercises.forEach((exercise) => {

    const div = document.createElement("div");
    div.className = "exercise";

    div.innerHTML = `
      <h3>${exercise[0]}</h3>
      <p>${exercise[1]}</p>
      <button onclick="alert('ابدأ ببطء وتوقف إذا شعرت بالألم.')">
        ابدأ التمرين
      </button>
    `;

    list.appendChild(div);

  });

  section.style.display = "block";

  section.scrollIntoView({
    behavior: "smooth"
  });
}

</script>

</body>
</html>
