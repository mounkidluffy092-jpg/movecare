<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoveCare | تمارين منزلية</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  margin:0;
  background:#f4f8ff;
  color:#172033;
  overflow-x:hidden;
}

/* زخارف الخلفية */

body::before{
  content:"";
  position:fixed;
  width:260px;
  height:260px;
  border-radius:50%;
  background:#dceaff;
  top:-100px;
  right:-80px;
  z-index:-1;
}

body::after{
  content:"";
  position:fixed;
  width:220px;
  height:220px;
  border-radius:50%;
  background:#e8f7ef;
  bottom:-90px;
  left:-70px;
  z-index:-1;
}

/* الرأس */

header{
  background:linear-gradient(135deg,#1677ff,#49a0ff);
  color:white;
  padding:28px 18px;
  border-radius:0 0 30px 30px;
  box-shadow:0 5px 20px #b9d5ff;
}

.header-content{
  max-width:900px;
  margin:auto;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

/* المحتوى */

.container{
  max-width:900px;
  margin:auto;
  padding:20px 15px 40px;
}

/* الترحيب */

.welcome{
  background:white;
  border-radius:22px;
  padding:22px;
  margin-top:5px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.welcome h2{
  margin-top:0;
}

.start-btn{
  background:#1677ff;
  color:white;
  border:0;
  padding:13px 25px;
  border-radius:13px;
  font-size:17px;
  cursor:pointer;
}

/* الأيام */

.section-title{
  margin-top:28px;
}

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}

.day{
  background:white;
  border:2px solid transparent;
  border-radius:14px;
  padding:12px 4px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.day:hover{
  border-color:#1677ff;
}

.day.active{
  background:#1677ff;
  color:white;
}

.day-name{
  font-size:13px;
}

.day-number{
  font-size:20px;
  font-weight:bold;
  margin-top:5px;
}

/* منطقة التمرين */

.workout{
  margin-top:25px;
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.workout-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.workout-header h2{
  margin:0;
}

.badge{
  background:#e7f0ff;
  color:#1677ff;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

/* الشخصية */

.character{
  margin:20px 0;
  min-height:180px;
  background:linear-gradient(135deg,#eef6ff,#f7fbff);
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  border:1px solid #e0ecff;
}

.character-icon{
  font-size:80px;
}

.character p{
  margin:5px 0;
  color:#65748b;
}

/* التمارين */

.exercise{
  border:1px solid #e5eaf2;
  border-radius:17px;
  padding:16px;
  margin-top:12px;
}

.exercise-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.exercise h3{
  margin:0;
}

.exercise-info{
  color:#68778c;
  font-size:14px;
}

.exercise button{
  width:100%;
  margin-top:12px;
  border:0;
  background:#1677ff;
  color:white;
  padding:11px;
  border-radius:11px;
  cursor:pointer;
  font-size:15px;
}

/* التقدم */

.progress-box{
  margin-top:25px;
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.progress-bar{
  height:12px;
  background:#e7edf5;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress{
  width:0%;
  height:100%;
  background:#1677ff;
  transition:.4s;
}

/* المؤقت */

.timer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,20,40,.75);
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.timer-box{
  background:white;
  width:100%;
  max-width:380px;
  border-radius:25px;
  padding:30px;
  text-align:center;
}

.timer-number{
  font-size:70px;
  font-weight:bold;
  color:#1677ff;
  margin:15px;
}

.timer-box button{
  border:0;
  background:#1677ff;
  color:white;
  padding:12px 25px;
  border-radius:12px;
  cursor:pointer;
}

.close-btn{
  background:#e9eef5 !important;
  color:#172033 !important;
  margin-top:10px;
}

/* الهاتف */

@media(max-width:600px){

  .days{
    grid-template-columns:repeat(4,1fr);
  }

  .logo{
    font-size:26px;
  }

}

</style>
</head>

<body>

<header>

<div class="header-content">

<div class="logo">MoveCare 🏠</div>

<p>تمارين منزلية بسيطة تساعدك على الحركة والنشاط</p>

</div>

</header>


<div class="container">

<!-- الترحيب -->

<div class="welcome">

<h2>أهلاً بك 👋</h2>

<p>
اختر يومًا من الأسبوع وشاهد التمارين المقترحة لك.
</p>

<button class="start-btn" onclick="scrollToDays()">
ابدأ الآن
</button>

</div>


<!-- الأيام -->

<h2 class="section-title">📅 برنامج الأسبوع</h2>

<div class="days" id="days"></div>


<!-- التمرين -->

<div class="workout">

<div class="workout-header">

<h2 id="workoutTitle">تمرين اليوم</h2>

<span class="badge" id="workoutLevel">
مبتدئ
</span>

</div>


<!-- الشخصية -->

<div class="character">

<div class="character-icon">🧍</div>

<p>الشخصية التوضيحية</p>

<small>
سنضيف لاحقًا حركات ثلاثية الأبعاد للتمارين
</small>

</div>


<div id="exerciseList"></div>

</div>


<!-- التقدم -->

<div class="progress-box">

<h3>📊 تقدمك</h3>

<p id="progressText">
أنجزت 0 من 7 أيام
</p>

<div class="progress-bar">

<div class="progress" id="progress"></div>

</div>

</div>

</div>


<!-- المؤقت -->

<div class="timer" id="timer">

<div class="timer-box">

<h2 id="timerTitle">وقت التمرين</h2>

<div class="timer-number" id="timerNumber">
30
</div>

<p>ثانية</p>

<button onclick="stopTimer()">
إيقاف
</button>

<button class="close-btn" onclick="closeTimer()">
إغلاق
</button>

</div>

</div>


<script>

/* بيانات الأيام */

const workouts = [

{
day:"السبت",
title:"تمرين الجسم كامل",
level:"مبتدئ",
exercises:[
["المشي في المكان","30 ثانية"],
["القرفصاء","10 مرات"],
["الضغط على الحائط","10 مرات"],
["تمدد الجسم","30 ثانية"]
]
},

{
day:"الأحد",
title:"تمارين الرجلين",
level:"مبتدئ",
exercises:[
["القرفصاء","10 مرات"],
["رفع الساق","10 مرات"],
["تمدد الرجلين","30 ثانية"]
]
},

{
day:"الاثنين",
title:"تمارين الظهر",
level:"مبتدئ",
exercises:[
["تمدد الظهر","30 ثانية"],
["وضعية الطفل","30 ثانية"],
["تمدد جانبي","20 ثانية"]
]
},

{
day:"الثلاثاء",
title:"تمارين الصدر",
level:"مبتدئ",
exercises:[
["الضغط على الحائط","10 مرات"],
["ضغط الركبتين","8 مرات"],
["تمدد الصدر","30 ثانية"]
]
},

{
day:"الأربعاء",
title:"تمارين الذراعين",
level:"مبتدئ",
exercises:[
["دوائر الذراعين","30 ثانية"],
["رفع الذراعين","10 مرات"],
["تمدد الذراع","20 ثانية"]
]
},

{
day:"الخميس",
title:"تمارين البطن",
level:"مبتدئ",
exercises:[
["بلانك خفيف","20 ثانية"],
["رفع الركبتين","10 مرات"],
["تمدد البطن","20 ثانية"]
]
},

{
day:"الجمعة",
title:"راحة ونشاط خفيف",
level:"راحة",
exercises:[
["المشي الخفيف","10 دقائق"],
["تمدد الجسم","3 دقائق"],
["التنفس والاسترخاء","2 دقيقة"]
]
}

];


let completedDays =
JSON.parse(localStorage.getItem("completedDays") || "[]");


/* إنشاء الأيام */

const daysContainer =
document.getElementById("days");

workouts.forEach((workout,index)=>{

const day=document.createElement("div");

day.className="day";

if(index===0){
day.classList.add("active");
}

day.innerHTML=`
<div class="day-name">${workout.day}</div>
<div class="day-number">${index+1}</div>
`;

day.onclick=()=>selectDay(index);

daysContainer.appendChild(day);

});


/* اختيار اليوم */

function selectDay(index){

document.querySelectorAll(".day")
.forEach(d=>d.classList.remove("active"));

document.querySelectorAll(".day")[index]
.classList.add("active");

const workout=workouts[index];

document.getElementById("workoutTitle")
.textContent=workout.title;

document.getElementById("workoutLevel")
.textContent=workout.level;

const list=document.getElementById("exerciseList");

list.innerHTML="";


workout.exercises.forEach(exercise=>{

const div=document.createElement("div");

div.className="exercise";

div.innerHTML=`

<div class="exercise-top">

<h3>${exercise[0]}</h3>

<span class="exercise-info">
${exercise[1]}
</span>

</div>

<button onclick="startTimer('${exercise[0]}')">
▶ ابدأ التمرين
</button>

`;

list.appendChild(div);

});

}


/* التمرين الأول */

selectDay(0);


/* المؤقت */

let timerInterval;

let timerSeconds=30;


function startTimer(name){

document.getElementById("timerTitle")
.textContent=name;

timerSeconds=30;

document.getElementById("timerNumber")
.textContent=timerSeconds;

document.getElementById("timer")
.style.display="flex";


clearInterval(timerInterval);

timerInterval=setInterval(()=>{

timerSeconds--;

document.getElementById("timerNumber")
.textContent=timerSeconds;

if(timerSeconds<=0){

clearInterval(timerInterval);

alert("أحسنت! انتهى وقت التمرين 🎉");

}

},1000);

}


function stopTimer(){

clearInterval(timerInterval);

}


function closeTimer(){

clearInterval(timerInterval);

document.getElementById("timer")
.style.display="none";

}


/* التقدم */

function updateProgress(){

const count=completedDays.length;

document.getElementById("progressText")
.textContent=`أنجزت ${count} من 7 أيام`;

document.getElementById("progress")
.style.width=(count/7*100)+"%";

}


updateProgress();


/* التمرير */

function scrollToDays(){

document.getElementById("days")
.scrollIntoView({
behavior:"smooth"
});

}

</script>

</body>
     </html>
